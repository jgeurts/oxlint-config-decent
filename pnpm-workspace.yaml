minimumReleaseAgeExclude:
  - semantic-release@25.0.6
# pnpm 11 reads settings from this file (.npmrc non-auth settings are ignored).
saveExact: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.1
  vite-plus: 0.3.1
overrides:
  vite: 'catalog:'
  # semantic-release resolves its plugins from its own dependency tree first, so a devDependency
  # alone is ignored. Force its bundled copies onto the v15/v14 betas that support
  # conventional-changelog-writer@9, which conventional-changelog-conventionalcommits@10 requires.
  # Drop once semantic-release itself depends on these majors.
  '@semantic-release/commit-analyzer': 14.0.0-beta.3
  '@semantic-release/release-notes-generator': 15.0.0-beta.2
# eslint 10 is ahead of what some eslint-ecosystem plugins declare; the -compat
# plugins are only used syntactically via oxlint's JS-plugin runtime, so the
# mismatch is acceptable. typescript needs no rule: it resolves to the official
# @typescript/typescript6 compatibility package (TS 6.0 JS API), which satisfies
# typescript-eslint's peer range while tsc comes from TS 7 (@typescript/native).
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    eslint: '10'
    vite: '*'
